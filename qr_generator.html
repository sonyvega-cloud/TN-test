<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<title>TN QR Generator · 1920×1080</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --panel-2: #1e1e1e;
    --line: #2a2a2a;
    --line-2: #3a3a3a;
    --text: #ededed;
    --muted: #8a8a8a;
    --accent: #e30613;
    --accent-dim: #4a0a10;
    --radius: 8px;
    --radius-lg: 12px;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--sans); margin: 0; padding: 0; }
  body { padding: 24px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
  h1 span { color: var(--accent); }
  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; }
  .panel + .panel { margin-top: 16px; }
  .panel h2 { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 500; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea, input[type="text"], input[type="number"], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 10px; font-family: var(--mono);
    font-size: 13px; width: 100%; outline: none;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--line-2); }
  textarea { resize: vertical; min-height: 56px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .row .lbl { width: 88px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .row input[type="number"] { width: 80px; flex-shrink: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 12px; font-family: var(--sans);
    font-size: 12px; cursor: pointer; transition: border-color 0.12s, background 0.12s;
  }
  button:hover { border-color: var(--line-2); background: var(--panel); }
  button:active { transform: scale(0.98); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600;
  }
  button.primary:hover { background: #ff2030; }
  button.ghost { background: transparent; }
  /* Fixed position cards */
  .fixed-cards { display: flex; flex-direction: column; gap: 8px; }
  .fixed-card {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); cursor: pointer;
    text-align: left; font-family: var(--sans);
    transition: border-color 0.15s, background 0.15s;
  }
  .fixed-card:hover { border-color: var(--line-2); }
  .fixed-card.active {
    border-color: var(--accent);
    background: rgba(227, 6, 19, 0.08);
  }
  .fixed-card-mini {
    width: 96px; height: 54px;
    background: #000; border-radius: 3px;
    position: relative; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .fixed-card-rect { position: absolute; background: var(--accent); }
  .fixed-card-lista { position: absolute; background: var(--accent); opacity: 0.7; border-radius: 1px; }
  .fixed-card-info { flex: 1; min-width: 0; }
  .fixed-card-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .badge-lista {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
    background: var(--panel); padding: 2px 6px; border-radius: 3px;
    border: 1px solid var(--line);
  }
  .fixed-card.active .badge-lista { color: #ffb3b3; border-color: var(--accent-dim); }
  .fixed-card.active .fixed-card-title { color: #fff; }
  .fixed-card-desc { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }

  /* Details rollup */
  details.advanced {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  details.advanced summary {
    cursor: pointer; padding: 12px 16px; list-style: none;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); user-select: none;
    display: flex; align-items: center;
  }
  details.advanced summary::-webkit-details-marker { display: none; }
  details.advanced summary::before {
    content: '▸';
    margin-right: 10px;
    font-size: 11px;
    transition: transform 0.15s;
  }
  details.advanced[open] summary::before { transform: rotate(90deg); }
  details.advanced[open] summary {
    color: var(--text);
    border-bottom: 1px solid var(--line);
  }
  .advanced-body { padding: 14px 16px 16px; }
  .check {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); cursor: pointer; user-select: none;
  }
  input[type="checkbox"] { accent-color: var(--accent); }
  input[type="color"] { width: 40px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; cursor: pointer; }
  .preview-wrap {
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #1a1a1a;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 12px;
  }
  canvas { display: block; width: 100%; height: auto; border-radius: var(--radius); }
  .meta { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .meta .ok { color: #6ad06a; }
  .meta .err { color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pin {
    display: inline-block; background: var(--accent-dim); color: #ffb3b3;
    padding: 2px 8px; border-radius: 4px; font-family: var(--mono); font-size: 11px;
    margin-left: 6px;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  /* Masthead */
  .masthead {
    display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
    padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .tn-logo {
    width: 44px; height: 44px; flex-shrink: 0;
  }
  .tn-logo svg { width: 100%; height: 100%; display: block; }
  .tn-logo .tn-bg { fill: var(--accent); }
  .tn-logo .tn-letters { fill: #ffffff; }
  .masthead .title-block { display: flex; flex-direction: column; line-height: 1.2; }
  .masthead .title { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
  .masthead .sub { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>

<div class="masthead">
  <div class="tn-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="480.94 294.91 275.33 275.33" aria-label="TN logo">
      <rect x="480.94" y="294.91" width="275.33" height="275.33" class="tn-bg"/>
      <path class="tn-letters" d="M719.46,491.63h-28.47l-51.15-67.82v67.82h-28.07v-91.73h-39.19v91.73h-29.19v-91.73h-33.91v-25.85h130.36l51.15,68.1v-68.1h28.47v117.58Z"/>
    </svg>
  </div>
  <div class="title-block">
    <span class="title">TN QR Generator</span>
    <span class="sub">1920 × 1080 · alpha PNG</span>
  </div>
</div>

<div class="grid">

  <!-- LEFT: controls -->
  <div>
    <div class="panel">
      <h2>Data</h2>
      <textarea id="data">www.tn.cz</textarea>
    </div>

    <div class="panel">
      <h2>Pozice</h2>
      <div class="fixed-cards">
        <button type="button" class="fixed-card" data-id="1" onclick="preset(1)">
          <div class="fixed-card-mini">
            <div class="fixed-card-rect" style="left:6.04%; top:70.74%; width:10.83%; height:19.26%;"></div>
          </div>
          <div class="fixed-card-info">
            <div class="fixed-card-title">Pevná 1</div>
            <div class="fixed-card-desc">116, 764 · 208 × 208 px</div>
          </div>
        </button>
        <button type="button" class="fixed-card" data-id="2" onclick="preset(2)">
          <div class="fixed-card-mini">
            <div class="fixed-card-rect" style="left:85.00%; top:12.59%; width:8.96%; height:15.93%;"></div>
          </div>
          <div class="fixed-card-info">
            <div class="fixed-card-title">Pevná 2</div>
            <div class="fixed-card-desc">1632, 136 · 172 × 172 px</div>
          </div>
        </button>
        <button type="button" class="fixed-card" data-id="3" onclick="preset(3)">
          <div class="fixed-card-mini">
            <!-- lista preview (red, smaller) -->
            <div class="fixed-card-lista" style="left:43.44%; top:81.11%; width:38.33%; height:6.30%;"></div>
            <!-- QR preview -->
            <div class="fixed-card-rect" style="left:83.07%; top:68.15%; width:10.83%; height:19.26%;"></div>
          </div>
          <div class="fixed-card-info">
            <div class="fixed-card-title">Pevná 3 <span class="badge-lista">+ lista</span></div>
            <div class="fixed-card-desc">1595, 736 · 208 × 208 px</div>
          </div>
        </button>
      </div>
    </div>

    <div class="panel">
      <h2>Vzhled</h2>
      <div class="row" style="margin-bottom: 12px;">
        <span class="lbl">Korekce</span>
        <select id="level" style="flex: 1;">
          <option value="L">L · 7 %</option>
          <option value="M" selected>M · 15 %</option>
          <option value="Q">Q · 25 %</option>
          <option value="H">H · 30 %</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="bg-white" checked /> Bílý čtverec pod QR</label>
    </div>

    <div class="panel" id="lista-panel" style="display: none;">
      <h2>Lista</h2>
      <label class="check" style="margin-bottom: 12px;">
        <input type="checkbox" id="lista-on" checked /> Lista zapnutá
      </label>
      <label>Text</label>
      <input type="text" id="lista-text" value="Andrej Babiš hostem TN Live" />
    </div>

    <details class="advanced">
      <summary>Manuální úprava · pozice, velikost, barva</summary>
      <div class="advanced-body">
        <div class="row">
          <span class="lbl">X (px)</span>
          <input type="range" id="x-r" min="0" max="1920" step="1" value="116" />
          <input type="number" id="x-n" min="0" max="1920" step="1" value="116" />
        </div>
        <div class="row">
          <span class="lbl">Y (px)</span>
          <input type="range" id="y-r" min="0" max="1080" step="1" value="764" />
          <input type="number" id="y-n" min="0" max="1080" step="1" value="764" />
        </div>
        <div class="row">
          <span class="lbl">Velikost</span>
          <input type="range" id="size-r" min="40" max="1080" step="1" value="208" />
          <input type="number" id="size-n" min="40" max="1080" step="1" value="208" />
        </div>
        <div class="row" style="margin-bottom: 14px;">
          <span class="lbl">Quiet zone</span>
          <input type="range" id="quiet-r" min="0" max="80" step="1" value="8" />
          <input type="number" id="quiet-n" min="0" max="80" step="1" value="8" />
        </div>
        <div class="row">
          <span class="lbl">Barva</span>
          <input type="color" id="color" value="#000000" />
          <input type="text" id="color-hex" value="#000000" style="font-size: 12px; flex: 1;" />
        </div>
      </div>
    </details>
  </div>

  <!-- RIGHT: preview + export -->
  <div>
    <div class="panel">
      <h2>Náhled · 1920×1080 (transparentní pozadí)</h2>
      <div class="preview-wrap">
        <canvas id="canvas" width="1920" height="1080"></canvas>
      </div>
      <div class="meta" id="meta">—</div>
      <div class="actions">
        <button class="primary" id="export">⬇ Export 1920×1080 PNG (alfa)</button>
        <button id="export-crop">⬇ Export jen QR čtverec</button>
        <button class="ghost" id="copy-pos" title="Zkopíruje X, Y, velikost do schránky">⧉ Pozice do schránky</button>
      </div>
    </div>
  </div>

</div>

<!-- ============ EMBEDDED QRCODE-GENERATOR LIBRARY ============ -->
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code

<!-- ============ APP ============ -->
<script>
(function(){
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const W = 1920, H = 1080;
  const FIXED = [
    { id: 1, label: 'Pevná 1', x: 116,  y: 764, size: 208 },
    { id: 2, label: 'Pevná 2', x: 1632, y: 136, size: 172 },
    { id: 3, label: 'Pevná 3', x: 1595, y: 736, size: 208, listaCapable: true }
  ];

  const LISTA_DEFAULT_TEXT = 'Andrej Babiš hostem TN Live';

  function vals(){
    return {
      data: $('data').value || ' ',
      x: clamp(parseInt($('x-n').value, 10) || 0, 0, W),
      y: clamp(parseInt($('y-n').value, 10) || 0, 0, H),
      size: clamp(parseInt($('size-n').value, 10) || 40, 40, 1080),
      quiet: clamp(parseInt($('quiet-n').value, 10) || 0, 0, 80),
      color: $('color').value,
      level: $('level').value,
      bg: $('bg-white').checked
    };
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function matchFixed(o){
    return FIXED.find(f => f.x === o.x && f.y === o.y && f.size === o.size) || null;
  }

  function render(){
    const o = vals();
    ctx.clearRect(0, 0, W, H);
    let qr;
    try {
      qr = qrcode(0, o.level);
      qr.addData(o.data);
      qr.make();
    } catch(e){
      $('meta').innerHTML = '<span class="err">Chyba: data jsou příliš dlouhá pro úroveň ' + o.level + '. Zkus L nebo zkrať obsah.</span>';
      const matchedErr = matchFixed(o);
      updateFixedCards(matchedErr);
      updateListaPanel(matchedErr);
      return;
    }
    const count = qr.getModuleCount();
    const inner = o.size - o.quiet * 2;
    if (inner <= 0) {
      $('meta').innerHTML = '<span class="err">Quiet zone je větší než velikost čtverce.</span>';
      return;
    }
    const m = inner / count;

    if (o.bg) {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(o.x, o.y, o.size, o.size);
    }

    ctx.fillStyle = o.color;
    const ox = o.x + o.quiet;
    const oy = o.y + o.quiet;
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          const x0 = Math.floor(ox + c * m);
          const x1 = Math.floor(ox + (c + 1) * m);
          const y0 = Math.floor(oy + r * m);
          const y1 = Math.floor(oy + (r + 1) * m);
          ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
        }
      }
    }

    const matched = matchFixed(o);

    // Lista (only for Pevná 3, when toggle is on)
    let listaDrawn = false;
    if (matched && matched.listaCapable && $('lista-on').checked) {
      drawLista(o, $('lista-text').value);
      listaDrawn = true;
    }

    const fixedTag = matched
      ? '<span class="ok">' + matched.label.toUpperCase() + ' OK' + (listaDrawn ? ' + LISTA' : '') + '</span>'
      : '<span style="color: var(--muted)">vlastní pozice</span>';
    $('meta').innerHTML =
      'modulů ' + count + '×' + count +
      ' · pozice (' + o.x + ', ' + o.y + ')' +
      ' · čtverec ' + o.size + 'px' +
      ' · ' + fixedTag;
    updateFixedCards(matched);
    updateListaPanel(matched);
  }

  // Lista layout constants — taken from reference design (red variant)
  const LISTA = {
    height: 68,           // bar height (smaller than before)
    gapToQr: 25,          // px gap between lista right edge and QR left edge
    paddingX: 19,         // text right padding inside lista
    paddingLeft: 27,      // text left padding inside lista
    fontSize: 46,         // text font size in px
    bgColor: '#e30613',   // TN red, 100% opacity
    textColor: '#ffffff',
    textBaselineBias: 4,  // optical centering bias (text sits slightly lower)
    fontStack: '700 46px "Organica GR", "Organica", "Tablet Gothic", "Inter", "Helvetica Neue", Arial, sans-serif'
  };

  function drawLista(o, text){
    const txt = (text || '').trim() || ' ';
    const qrBottom = o.y + o.size;
    const listaRight = o.x - LISTA.gapToQr;
    const listaTop = qrBottom - LISTA.height;

    // Measure text width using the actual font stack
    ctx.font = LISTA.fontStack;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const metrics = ctx.measureText(txt);
    const textWidth = metrics.width;

    // Lista width = text + side paddings
    const listaWidth = Math.ceil(textWidth + LISTA.paddingX + LISTA.paddingLeft);
    const listaLeft = listaRight - listaWidth;

    // Background — TN red, 100% opaque
    ctx.fillStyle = LISTA.bgColor;
    ctx.fillRect(listaLeft, listaTop, listaWidth, LISTA.height);

    // Text — white, right-aligned, optically centered (slight downward bias)
    ctx.fillStyle = LISTA.textColor;
    const textY = listaTop + LISTA.height / 2 + LISTA.textBaselineBias;
    const textX = listaRight - LISTA.paddingX;
    ctx.fillText(txt, textX, textY);

    // Reset alignment
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function updateListaPanel(matched){
    const panel = $('lista-panel');
    if (matched && matched.listaCapable) {
      panel.style.display = '';
    } else {
      panel.style.display = 'none';
    }
  }

  function updateFixedCards(matched){
    document.querySelectorAll('.fixed-card').forEach(card => {
      const id = parseInt(card.dataset.id, 10);
      card.classList.toggle('active', !!(matched && matched.id === id));
    });
  }

  function bindPair(rId, nId, lo, hi){
    const r = $(rId), n = $(nId);
    r.addEventListener('input', () => { n.value = r.value; render(); });
    n.addEventListener('input', () => {
      let v = parseInt(n.value, 10);
      if (isNaN(v)) return;
      v = clamp(v, lo, hi);
      r.value = v;
      render();
    });
  }
  bindPair('x-r', 'x-n', 0, W);
  bindPair('y-r', 'y-n', 0, H);
  bindPair('size-r', 'size-n', 40, 1080);
  bindPair('quiet-r', 'quiet-n', 0, 80);

  ['data','color','level'].forEach(id => $(id).addEventListener('input', render));
  $('bg-white').addEventListener('change', render);
  $('lista-on').addEventListener('change', render);
  $('lista-text').addEventListener('input', render);

  // Color hex sync
  $('color').addEventListener('input', () => { $('color-hex').value = $('color').value.toUpperCase(); });
  $('color-hex').addEventListener('input', () => {
    const v = $('color-hex').value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { $('color').value = v; render(); }
  });

  window.preset = function(p){
    let x, y, s = parseInt($('size-n').value, 10);
    const margin = 80;
    if (typeof p === 'number') {
      const f = FIXED.find(it => it.id === p);
      if (!f) return;
      x = f.x; y = f.y; s = f.size;
    } else if (p === 'tl') { x = margin; y = margin; }
    else if (p === 'tr') { x = W - s - margin; y = margin; }
    else if (p === 'bl') { x = margin; y = H - s - margin; }
    else if (p === 'br') { x = W - s - margin; y = H - s - margin; }
    else if (p === 'c')  { x = Math.floor((W - s) / 2); y = Math.floor((H - s) / 2); }
    else return;
    $('x-r').value = x; $('x-n').value = x;
    $('y-r').value = y; $('y-n').value = y;
    $('size-r').value = s; $('size-n').value = s;
    render();
  };

  function downloadCanvas(cv, filename){
    cv.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
    }, 'image/png');
  }

  function safeName(s){
    return (s || 'qr').replace(/[^a-zA-Z0-9._-]+/g, '_').slice(0, 40) || 'qr';
  }

  $('export').addEventListener('click', () => {
    const o = vals();
    const name = 'qr_1920x1080_x' + o.x + '_y' + o.y + '_s' + o.size + '_' + safeName(o.data) + '.png';
    downloadCanvas(canvas, name);
  });

  $('export-crop').addEventListener('click', () => {
    const o = vals();
    const tmp = document.createElement('canvas');
    tmp.width = o.size;
    tmp.height = o.size;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(canvas, o.x, o.y, o.size, o.size, 0, 0, o.size, o.size);
    downloadCanvas(tmp, 'qr_' + o.size + 'x' + o.size + '_' + safeName(o.data) + '.png');
  });

  $('copy-pos').addEventListener('click', async () => {
    const o = vals();
    const txt = 'X=' + o.x + ', Y=' + o.y + ', size=' + o.size;
    try {
      await navigator.clipboard.writeText(txt);
      const btn = $('copy-pos');
      const orig = btn.textContent;
      btn.textContent = '✓ zkopírováno';
      setTimeout(() => btn.textContent = orig, 1200);
    } catch(e) {
      alert(txt);
    }
  });

  render();
})();
</script>
